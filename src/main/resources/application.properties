# ==============================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (MySQL)
# ==============================================================
# Asegúrate de que XAMPP esté corriendo en el puerto 3306
spring.datasource.url=jdbc:mysql://localhost:3306/proyectobbackenduniremington2026?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==============================================================
# 'update' crea las tablas automáticamente si no existen
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola para depuración
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SOLUCIÓN AL WARNING DE DIALECTO
# Se usa el dialecto genérico moderno para evitar errores de deprecación
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ESTRATEGIA DE NOMENCLATURA (Naming Strategy)
# Convierte 'nombreIndicador' (Java) a 'nombre_indicador' (MySQL)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ==============================================================
# CONFIGURACIÓN DEL SERVIDOR
# ==============================================================
# Puerto por defecto del backend
server.port=8080

# Evita que la conexión se cierre inesperadamente en sesiones largas
spring.jpa.open-in-view=false

# (Opcional) Habilita log detallado de la conexión/consultas JPA al depurar
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
